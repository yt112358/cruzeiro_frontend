<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <title>ONG Esperança - Cadastro de Voluntário</title>
  <link rel="stylesheet" type="text/css" href="css/style.css" />
  <script src="js/cpf_validation.js"></script>
  <script src="js/phone.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</head>

<body>
  <header>
    <h1>Formulário de Cadastro de Voluntário</h1>
    <nav>
      <div><a href="index.html">Home ⤴️</a></div>
      <div><a href="projects.html">Projetos ⤴️</a></div>
    </nav>
  </header>
  <main>
    <form onsubmit="alert('Formulário enviado com sucesso!'); return false;" method="post">
      <fieldset>
        <legend>Informação pessoal</legend>
        <fieldset>
          <legend>Nome Completo:</legend>
          <input class="long-input" type="text" id="nome" name="nome" minlength="2" maxlength="100" required>
        </fieldset>
        <fieldset>
          <legend>Gênero:</legend>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="sample"> Feminino
            </label>
            <label class="radio-label">
              <input type="radio" name="sample"> Masculino
            </label>
            <label class="radio-label">
              <input type="radio" name="sample"> Outro
              <input class="long-input" type="text" id="genero-outro" name="genero-outro"
                placeholder="Especifique se outro">
            </label>
          </div>
        </fieldset>
        <fieldset>
          <legend>Data de Nascimento:</legend>
          <input type="text" id="datepicker" placeholder="DD/MM/YYYY">
          <script>
            flatpickr("#datepicker", {
              dateFormat: "d/m/Y",
            });
          </script>

        </fieldset>
        <fieldset>
          <legend>CPF:</legend>
          <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" autocomplete="off" maxlength="14"
            inputmode="numeric" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" required
            onblur="if(validarCPF(this.value)) { this.value = formatarCPF(this.value); }">
        </fieldset>
      </fieldset>
      <fieldset>
        <legend>Contato</legend>
        <fieldset>
          <legend>Telefone:</legend>
          <input type="text" id="telefone" name="telefone" placeholder="(00) 00000-0000" autocomplete="off"
            maxlength="15" inputmode="numeric" pattern="\(\d{2}\) \d{4,5}-\d{4}" required
            onblur="this.value = formatarTelefone(this.value);">
        </fieldset>
        <fieldset>
          <legend>e-mail:</legend>
          <input class="long-input" type="email" id="email" name="email" placeholder="seu.email@exemplo.com" required>
        </fieldset>
      </fieldset>
      <div class="form-actions">
        <input type="submit" value="Enviar">
      </div>
    </form>
  </main>
</body>

</html>
